<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Speech to Text</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stt.css') }}">
</head>
<body class="stt-body">
    <div class="stt-page">
        <header class="stt-header">
            <div class="stt-logo-circle">
                <div class="stt-logo-bars">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="stt-logo-text">
                speech <span>web</span>
            </div>
        </header>

        <main class="stt-main">
            <h1 class="stt-title">Speech to Text</h1>
            <div class="stt-underline"></div>

            <section class="stt-card">
                <div id="micPanel" class="stt-box">
                    <p id="micPlaceholder" class="stt-placeholder">
                        Klik tombol untuk mulai merekam
                    </p>

                    <div class="stt-mic-visual">
                        <div class="stt-mic-icon"></div>
                    </div>
                </div>

                <div class="stt-action">
                    <button type="button" id="recordBtn" class="stt-convert-btn">
                        Convert to text
                    </button>

                    <p id="statusText" class="stt-status">
                        Siap merekam
                    </p>
                </div>
            </section>

            <audio id="audioPreview" class="stt-audio-preview" controls></audio>

            <div id="resultBox" class="stt-result-box"></div>

            <a href="/" class="stt-back-btn">Kembali ke Landing Page</a>
        </main>
    </div>

    <script>
        let audioContext;
        let mediaStream;
        let source;
        let processor;
        let audioData = [];
        let isRecording = false;

        const recordBtn = document.getElementById("recordBtn");
        const statusText = document.getElementById("statusText");
        const micPanel = document.getElementById("micPanel");
        const micPlaceholder = document.getElementById("micPlaceholder");
        const audioPreview = document.getElementById("audioPreview");
        const resultBox = document.getElementById("resultBox");

        recordBtn.addEventListener("click", function () {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
            try {
                audioData = [];

                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                audioContext = new AudioContext();
                source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = function (event) {
                    if (!isRecording) return;

                    const inputData = event.inputBuffer.getChannelData(0);
                    audioData.push(new Float32Array(inputData));
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                isRecording = true;

                recordBtn.textContent = "Stop & Prediksi";
                statusText.textContent = "Sedang merekam...";
                micPlaceholder.textContent = "Sedang merekam...";
                micPanel.classList.add("recording");

                resultBox.style.display = "none";
                audioPreview.style.display = "none";

            } catch (error) {
                resultBox.style.display = "block";
                resultBox.innerHTML = "<p>Microphone tidak bisa diakses. Izinkan akses microphone di browser.</p>";
            }
        }

        function stopRecording() {
            isRecording = false;

            recordBtn.disabled = true;
            recordBtn.textContent = "Memproses...";
            statusText.textContent = "Memproses suara...";
            micPlaceholder.textContent = "Rekaman selesai";
            micPanel.classList.remove("recording");

            if (processor) {
                processor.disconnect();
            }

            if (source) {
                source.disconnect();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            const mergedAudio = mergeBuffers(audioData);
            const wavBlob = encodeWAV(mergedAudio, audioContext.sampleRate);

            const audioUrl = URL.createObjectURL(wavBlob);
            audioPreview.src = audioUrl;
            audioPreview.style.display = "block";

            sendAudioToServer(wavBlob);

            if (audioContext) {
                audioContext.close();
            }
        }

        function mergeBuffers(buffers) {
            let length = 0;

            buffers.forEach(buffer => {
                length += buffer.length;
            });

            const result = new Float32Array(length);
            let offset = 0;

            buffers.forEach(buffer => {
                result.set(buffer, offset);
                offset += buffer.length;
            });

            return result;
        }

        function encodeWAV(samples, sampleRate) {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);

            writeString(view, 0, "RIFF");
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(view, 8, "WAVE");
            writeString(view, 12, "fmt ");
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, "data");
            view.setUint32(40, samples.length * 2, true);

            floatTo16BitPCM(view, 44, samples);

            return new Blob([view], {
                type: "audio/wav"
            });
        }

        function floatTo16BitPCM(output, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                let sample = Math.max(-1, Math.min(1, input[i]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                output.setInt16(offset, sample, true);
            }
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        async function sendAudioToServer(wavBlob) {
            const formData = new FormData();
            formData.append("audio", wavBlob, "recorded_audio.wav");

            try {
                const response = await fetch("/speech-to-text", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                recordBtn.disabled = false;
                recordBtn.textContent = "Convert to text";
                statusText.textContent = "Selesai diproses";

                resultBox.style.display = "block";

                if (!data.success) {
                    resultBox.innerHTML = `<p>${data.message}</p>`;
                    return;
                }

                let html = `
                    <h3>Hasil Prediksi</h3>
                    <p><strong>Kota Terdeteksi:</strong> ${data.prediction}</p>
                `;

                if (data.confidence !== null) {
                    html += `<p><strong>Confidence:</strong> ${data.confidence}%</p>`;
                }

                if (data.top3 && data.top3.length > 0) {
                    html += `<p><strong>Top 3 Kandidat:</strong></p>`;
                    html += "<ol>";

                    data.top3.forEach(item => {
                        html += `<li>${item.city}: ${item.score}%</li>`;
                    });

                    html += "</ol>";
                }

                resultBox.innerHTML = html;

            } catch (error) {
                recordBtn.disabled = false;
                recordBtn.textContent = "Convert to text";
                statusText.textContent = "Gagal diproses";

                resultBox.style.display = "block";
                resultBox.innerHTML = "<p>Gagal mengirim audio ke server.</p>";
            }
        }
    </script>
</body>
</html>
