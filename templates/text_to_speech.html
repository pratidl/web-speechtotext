<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=40">
</head>
<body class="tts-page">

    <img
        src="{{ url_for('static', filename='img/background.png') }}?v=40"
        alt="Background"
        class="background-img"
    >

    <header class="landing-header">
        <a href="/" class="brand">
            <span class="brand-icon">
                <span></span>
                <span></span>
                <span></span>
            </span>

            <span class="brand-text">
                speech <b>web</b>
            </span>
        </a>
    </header>

    <main class="tts-main">
        <section class="tts-wrapper">
            <h1>
                Text to Speech
                <span class="title-line tts-title-line"></span>
            </h1>

            <form method="POST" class="tts-form">
                <textarea
                    name="text"
                    class="tts-textarea"
                    placeholder="Masukkan teks di sini..."
                    required></textarea>

                <div class="tts-control-row">
                    <div class="tts-form-group">
                        <label for="gender">Pilih Gender</label>
                        <select name="gender" id="gender" required>
                            <option value="" disabled selected>Pilih Gender</option>
                            <option value="female">Perempuan</option>
                            <option value="male">Laki-laki</option>
                        </select>
                    </div>

                    <div class="tts-form-group">
                        <label for="speed">Kecepatan Suara</label>
                        <select name="speed" id="speed" required>
                            <option value="" disabled>Pilih Kecepatan</option>
                            <option value="slow">Lambat</option>
                            <option value="normal" selected>Normal</option>
                            <option value="fast">Cepat</option>
                        </select>
                    </div>

                    <button type="submit" class="tts-generate-btn">
                        <span class="audio-icon">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                        Generate Audio
                    </button>
                </div>
            </form>

            {% if audio_file %}
                <div class="tts-audio-result">
                    <h3>Hasil Audio</h3>
                    <audio controls>
                        <source src="{{ url_for('static', filename='output_audio/' + audio_file) }}" type="audio/mpeg">
                        Browser tidak mendukung audio.
                    </audio>
                </div>
            {% endif %}

            <a href="/" class="tts-back-btn">Kembali ke Landing Page</a>
        </section>
    </main>

</body>
</html>
